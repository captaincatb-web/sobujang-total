name: Daily approved snapshot update
on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/daily-snapshot.yml']
permissions:
  contents: write
concurrency:
  group: daily-approved-snapshot
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and refresh approved data
        run: python scripts/daily_refresh.py
      - name: Commit validated snapshot and status
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshot.json update-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: daily approved snapshot check"
          git push origin HEAD:gh-pages
